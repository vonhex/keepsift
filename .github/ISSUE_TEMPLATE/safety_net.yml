name: Safety net: wrong keep or wrong delete
description: The safety net removed something it should have kept, or keeps obvious junk
labels: [safety-net]
body:
  - type: markdown
    attributes:
      value: |
        These reports make KeepSift safer for everyone. Describe the email's **shape** with made-up text: never paste the real email, links or codes.
  - type: dropdown
    id: kind
    attributes:
      label: Which way was it wrong?
      options:
        - An important email was removed (or would have been)
        - Junk is always kept for a bad reason
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What the email looked like (anonymised)
      description: Sender type, subject style, and the important part with fake values, e.g. "Your code is: ABCD-1234" in an HTML button.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Kept reason shown in the Activity tab (if any)
      render: text
  - type: input
    id: model
    attributes:
      label: Model check on? Which model?
      placeholder: e.g. on, Qwen3 14B
