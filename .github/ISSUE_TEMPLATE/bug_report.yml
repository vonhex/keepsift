name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Don't paste real email content, email addresses, passwords or app passwords.** Replace them with made-up text.
        Security problems: please use the **Security** tab → **Report a vulnerability** instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Activity log or error
      description: The relevant lines from the Activity tab (redact anything personal).
      render: text
  - type: input
    id: version
    attributes:
      label: KeepSift version
      placeholder: v1.0.1, or commit hash if running from source
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options: [KeepSift.exe from Releases, Setup.bat / from source]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model server and model
      placeholder: e.g. llama.cpp + Qwen3 14B Q4_K_M
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
